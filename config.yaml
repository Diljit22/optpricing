# Live Data Configuration
live_data_provider: "yfinance"

# Base Directory Configuration
data_directory: "data"
artifacts_directory: "artifacts"

# Captured every trading day by the scheduled "Market snapshot" GitHub Action
# (compact, liquid-only chains, ~25 KB per ticker and day).
snapshot_tickers:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - JPM

# Used by --all in CLI commands
default_tickers:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA
  - JPM
  - GS
  - BAC
  - JNJ
  - UNH
  - PFE
  - WMT
  - HD
  - NKE
  - XOM
  - CVX
  - BA
  - CAT
  - AMC

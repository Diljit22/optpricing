name: Publish to PyPI

# Release flow: `git tag vX.Y.Z && git push origin vX.Y.Z`. setuptools_scm turns the
# tag into the package version, so the tag is the single source of truth.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to publish from anything but a version tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a vX.Y.Z tag (Actions > Publish > Use workflow from: Tags)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags for setuptools_scm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      - name: Verify the built version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's#.*/optpricing-(.+)\.tar\.gz#\1#')
          echo "tag=${expected} built=${built}"
          if [ "$expected" != "$built" ]; then
            echo "::error::Tag v${expected} does not match built version ${built}"
            exit 1
          fi

      - name: Guard against a bloated sdist
        run: |
          size=$(stat -c %s dist/*.tar.gz)
          echo "sdist size: ${size} bytes"
          if [ "$size" -gt 1000000 ]; then
            echo "::error::sdist is larger than 1 MB - check MANIFEST.in"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/optpricing/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
